################################################################################
# CEPH BLUESTORE OSD QCOW2 DISK EXPANSION
# Purpose: Grow a libvirt QCOW2 data disk and the Ceph BlueStore OSD LVM block LV
# Use for: Ceph VMs with a separate data disk (for example, vdb)
#
# IMPORTANT
# - This procedure EXPANDS storage only. Never use it to shrink a disk or LV.
# - Run the host section on the libvirt/KVM host; run the guest section in the
#   affected Ceph VM.
# - Resize one OSD at a time and verify cluster health between OSD restarts.
# - BlueStore uses a raw block LV. Do NOT run resize2fs, xfs_growfs, or
#   ceph-bluestore-tool bluefs-bdev-expand for this single "osd-block" device.
################################################################################


# ==============================================================================
# PART 1: KVM HOST - IDENTIFY THE CEPh DATA DISK
# ==============================================================================

# Show the VM's disks, their guest target names, and their host image paths.
# Example: ceph1-data.qcow2 might be attached to the guest as vdb.
sudo virsh domblklist ceph1 --details

# Show the current virtual disk capacity safely while the VM is running.
# Replace vdb with the target shown by domblklist.
sudo virsh domblkinfo ceph1 vdb --human

# Do NOT run qemu-img info or qemu-img resize on an image that is in use.
# It will normally fail because QEMU holds an exclusive lock on the QCOW2 image.


# ==============================================================================
# PART 2: KVM HOST - EXPAND THE RUNNING VIRTUAL DATA DISK
# ==============================================================================

# Set these values for the VM being expanded.
# NEW_SIZE is the FINAL desired capacity, not an amount to add.
CEPH_VM="ceph1"
CEPH_DISK_TARGET="vdb"
NEW_SIZE="500G"

# Expand the active disk through libvirt/QEMU.
# Do not add --live on older virsh versions; blockresize operates on the active
# domain and some versions reject that option.
sudo virsh blockresize "$CEPH_VM" "$CEPH_DISK_TARGET" "$NEW_SIZE"

# Confirm the new virtual capacity. Expected example: 500.000 GiB.
sudo virsh domblkinfo "$CEPH_VM" "$CEPH_DISK_TARGET" --human


# ==============================================================================
# PART 3: CEPH GUEST - DETECT THE LARGER DISK AND EXPAND ITS LVM PV
# ==============================================================================

# Confirm that the guest sees the enlarged data disk.
lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS

# If vdb does not show the new size yet, request a block-device rescan.
# If it returns Permission denied but lsblk already shows the new size, continue.
echo 1 | sudo tee /sys/class/block/vdb/device/rescan
lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS

# Resize the LVM physical volume that occupies the entire data disk.
sudo pvresize /dev/vdb

# Inspect the resulting free space in the Ceph volume group.
sudo pvs
sudo vgs
sudo lvs -o lv_path,lv_size,vg_name,lv_name


# ==============================================================================
# PART 4: CEPH GUEST - EXTEND THE BLUESTORE OSD BLOCK LV
# ==============================================================================

# From the lvs output, copy the path whose LV name starts with "osd-block-".
# Example only - replace this with the path for THIS Ceph VM/OSD:
# CEPH_OSD_LV="/dev/ceph-<VG_UUID>/osd-block-<OSD_UUID>"

# Use all free extents in that OSD's dedicated Ceph volume group.
# This changes the raw BlueStore block device; no filesystem resize follows.
sudo lvextend -l +100%FREE "$CEPH_OSD_LV"

# Verify that the OSD block LV now matches the new virtual disk capacity.
sudo lvs -o lv_path,lv_size,vg_name,lv_name

# Map the block LV to its Ceph OSD ID and FSID.
sudo ceph-volume lvm list


# ==============================================================================
# PART 5: CEPH VALIDATION / OPTIONAL CONTROLLED OSD RESTART
# ==============================================================================

# Check the local OSD service and cluster status.
sudo systemctl --no-pager status 'ceph-osd@*'
sudo ceph -s
sudo ceph osd df tree

# If Ceph still reports the old OSD capacity after the LV extension, restart only
# the OSD mapped by "ceph-volume lvm list". Replace <OSD_ID> with that number.
# Do this one OSD at a time so a replicated cluster remains available.
sudo systemctl restart ceph-osd@<OSD_ID>

# Verify the OSD returns to service and the cluster is healthy.
sudo systemctl --no-pager status ceph-osd@<OSD_ID>
sudo ceph -s
sudo ceph osd df tree


